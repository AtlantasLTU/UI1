<!DOCTYPE html>
<html lang="lt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kebabinė - krepšelis</title>
    <link rel="stylesheet" href="style.css">
    <script src="cart.js" defer></script>
  </head>
  <body>
    <header>
      <div class="headerDiv">
        <h1 id="name">Kebabinė</h1>
        <a href="index.html" class="cartLink">Pagrindinis</a>
      </div>
    </header>
    <main>
      <div class="cart">
        <h2>Jūsų užsakymas</h2>
        <ul id="cartItems"></ul>
        <p>Iš viso: <strong id="cartTotal">0.00 €</strong></p>
        <button class="addToCartButton" onclick="clearCart()">Išvalyti krepšelį</button>
      </div>
    </main>
    <footer>&copy; 2026 Kebabinė. Visos teisės saugomos.</footer>
  </body>
</html>
